# Fixed project name: hosts run this file from a release bundle whose folder changes with each release (D-033).
# Other clients on a central host run it as their own project, -p cctv-<client> (D-036). So no service has a fixed
# container name, services reach each other by service name on the project's own network, data paths are relative
# to the client's site folder, and the few published ports come from that site's .env.
name: cctv

services:
  mfr-cctv-producer-consumer:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-producer-consumer:${IMAGE_TAG:-v-beta}
    restart: unless-stopped
    environment:
      CAM_USERNAME: ${CAM_USERNAME}
      CAM_PASSWORD: ${CAM_PASSWORD}
      # This client's own logins, written to its site .env by deploy/provision.py (D-037)
      MILVUS_APP_USER: ${MILVUS_APP_USER:-}
      MILVUS_APP_PASSWORD: ${MILVUS_APP_PASSWORD:-}
      KAFKA_APP_USER: ${KAFKA_APP_USER:-}
      KAFKA_APP_PASSWORD: ${KAFKA_APP_PASSWORD:-}
    volumes:
      # Only config and data: the code comes from the image. Enrolment scripts that need the datasets run in their own container
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      - ./src/Camera-Configuration:/Multi-Person-Face-Recognition/src/Camera-Configuration:ro
      - ./logs:/Multi-Person-Face-Recognition/logs
      - ./Recognition_Frames:/Multi-Person-Face-Recognition/Recognition_Frames
    depends_on:
      mfr-database-controller:
        condition: service_healthy
      mfr-feedback-controller:
        condition: service_healthy
      dynamic-face-dataset-collector:
        condition: service_healthy
    stop_grace_period: 30s
    # The GPU's video decoder (NVDEC) decodes the camera streams (VIDEO_DECODE, docs/features/gpu-decode.md); "video"
    # gives the container the decoder library, which Docker Desktop also provides once it is asked for
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, video]

  mfr-database-controller:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-database-controller:${IMAGE_TAG:-v-beta}
    restart: unless-stopped
    environment:
      POSTGRESQL_PORT: ${POSTGRES_HOST_PORT:-5432}
      PG_APP_USER: ${PG_APP_USER:-}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-}
      # The admin login, used only while master.env has LEGACY_SHARED_SERVICES=1 (owner, until step 3c, D-037)
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      - ./src/Camera-Configuration:/Multi-Person-Face-Recognition/src/Camera-Configuration:ro
      - ./logs:/Multi-Person-Face-Recognition/logs
    healthcheck:
      test: ["CMD", "./src/database_server/healthcheck_db_controller.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mfr-feedback-controller:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-feedback-controller:${IMAGE_TAG:-v-beta}
    restart: unless-stopped
    environment:
      KAFKA_APP_USER: ${KAFKA_APP_USER:-}
      KAFKA_APP_PASSWORD: ${KAFKA_APP_PASSWORD:-}
    volumes:
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      - ./src/Camera-Configuration:/Multi-Person-Face-Recognition/src/Camera-Configuration:ro
      - ./logs:/Multi-Person-Face-Recognition/logs
    healthcheck:
      test: [ "CMD", "./src/feedback_server/healthcheck_feedback_controller.sh" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mfr-api-service:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-api:${IMAGE_TAG:-v-beta}
    restart: unless-stopped
    environment:
      POSTGRESQL_PORT: ${POSTGRES_HOST_PORT:-5432}
      # The site-wide camera login, for cameras that leave theirs null: the live view's MediaMTX pulls them (D-047)
      CAM_USERNAME: ${CAM_USERNAME}
      CAM_PASSWORD: ${CAM_PASSWORD}
      PG_APP_USER: ${PG_APP_USER:-}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-}
      # The admin login, used only while master.env has LEGACY_SHARED_SERVICES=1 (owner, until step 3c, D-037)
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # This client's key to its own enrolment bucket, written to its site .env by deploy/provision.py (D-037, D-048)
      STORE_APP_ACCESS_KEY: ${STORE_APP_ACCESS_KEY:-}
      STORE_APP_SECRET_KEY: ${STORE_APP_SECRET_KEY:-}
    volumes:
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      - ./src/Camera-Configuration:/Multi-Person-Face-Recognition/src/Camera-Configuration:ro
      - ./logs:/Multi-Person-Face-Recognition/logs
      # The API writes MediaMTX's configuration here at start, from the camera configuration
      - live-video-config:/live-video
      # The privacy notice the enrolment app shows before consent (notice.json), supplied by the client's admin
      - ./enrolment:/Multi-Person-Face-Recognition/enrolment:ro
    ports:
      # On this machine only, for the watcher; everyone else comes through the HTTPS proxy (D-040)
      - "127.0.0.1:${API_PORT:-9090}:8000"
    networks:
      - default
      - edge
    # database-controller creates CCTV_Camera_Surveillance, which the API reads
    depends_on:
      mfr-database-controller:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "./src/api/healthcheck_api.sh" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  dynamic-face-dataset-collector:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-dynamic-face-dataset-collector:${IMAGE_TAG:-v-beta}
    restart: unless-stopped
    volumes:
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      - ./DYNAMIC-FACIAL-RECOGNITION-DATASET:/Multi-Person-Face-Recognition/DYNAMIC-FACIAL-RECOGNITION-DATASET
      - ./logs:/Multi-Person-Face-Recognition/logs
    environment:
      POSTGRESQL_PORT: ${POSTGRES_HOST_PORT:-5432}
      PG_APP_USER: ${PG_APP_USER:-}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-}
      # The admin login, used only while master.env has LEGACY_SHARED_SERVICES=1 (owner, until step 3c, D-037)
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    init: true
    healthcheck:
      test: [ "CMD", "./src/dynamic_face_data_collector/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  automate-milvus-update:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-automate-milvus-update:${IMAGE_TAG:-v-beta}
    restart: unless-stopped
    volumes:
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      - ./DYNAMIC-FACIAL-RECOGNITION-DATASET:/Multi-Person-Face-Recognition/DYNAMIC-FACIAL-RECOGNITION-DATASET
      - ./logs:/Multi-Person-Face-Recognition/logs
    environment:
      POSTGRESQL_PORT: ${POSTGRES_HOST_PORT:-5432}
      PG_APP_USER: ${PG_APP_USER:-}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-}
      # The admin login, used only while master.env has LEGACY_SHARED_SERVICES=1 (owner, until step 3c, D-037)
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MILVUS_APP_USER: ${MILVUS_APP_USER:-}
      MILVUS_APP_PASSWORD: ${MILVUS_APP_PASSWORD:-}
    # Reads Face_Recognition_Database, which the collector creates
    depends_on:
      dynamic-face-dataset-collector:
        condition: service_healthy

  # Checks the enrolment app's jobs and publishes accepted people to Milvus (D-048). The producer-consumer image already
  # has the InsightFace client, OpenCV and the Milvus client, so this needs no image of its own
  enrolment-worker:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-producer-consumer:${IMAGE_TAG:-v-beta}
    restart: unless-stopped
    command: ["python3", "src/util/enrolment_worker.py"]
    volumes:
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      # Accepted people's vectors.parquet, which face_vectors.publish rebuilds Milvus from (D-030)
      - ./FACIAL-RECOGNITION-DATASET:/Multi-Person-Face-Recognition/FACIAL-RECOGNITION-DATASET
      - ./logs:/Multi-Person-Face-Recognition/logs
    environment:
      POSTGRESQL_PORT: ${POSTGRES_HOST_PORT:-5432}
      PG_APP_USER: ${PG_APP_USER:-}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-}
      # The admin login, used only while master.env has LEGACY_SHARED_SERVICES=1 (owner, until step 3c, D-037)
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MILVUS_APP_USER: ${MILVUS_APP_USER:-}
      MILVUS_APP_PASSWORD: ${MILVUS_APP_PASSWORD:-}
      STORE_APP_ACCESS_KEY: ${STORE_APP_ACCESS_KEY:-}
      STORE_APP_SECRET_KEY: ${STORE_APP_SECRET_KEY:-}
    # The API creates the enrolment tables at start
    depends_on:
      mfr-api-service:
        condition: service_healthy

  display-image-server:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-front-face-image-display:${IMAGE_TAG:-v-beta}
    restart: unless-stopped
    volumes:
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      - ./DISPLAY-FACE-DATASET:/Multi-Person-Face-Recognition/DISPLAY-FACE-DATASET
      - ./logs:/Multi-Person-Face-Recognition/logs
    ports:
      # Displays on other machines fetch portraits here
      - "127.0.0.1:${DISPLAY_IMAGE_PORT:-20013}:20013"
    init: true
    healthcheck:
      test: [ "CMD", "./src/fetch_face_image_server/healthcheck_display_image_server.sh" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # On-demand page to draw each camera's region of interest (D-035): docker compose --profile roi up -d roi-provisioning,
  # then open http://localhost:8069. It saves into the camera configuration, so that folder is mounted read-write here
  # only; it has no login and shows camera feeds, so it listens on this host only. Restart producer-consumer to apply.
  roi-provisioning:
    image: ghcr.io/hamza-aziz-ai/cctv-face-recognition-roi:${IMAGE_TAG:-v-beta}
    profiles: [roi]
    environment:
      CAM_USERNAME: ${CAM_USERNAME}
      CAM_PASSWORD: ${CAM_PASSWORD}
    volumes:
      - ./master.env:/Multi-Person-Face-Recognition/master.env
      - ./src/Camera-Configuration:/Multi-Person-Face-Recognition/src/Camera-Configuration
    ports:
      - "127.0.0.1:${ROI_PORT:-8069}:8069"

  # Recognition display for this host (Raspberry Pis run the same image with its default ports); versioned in the Kafka-WebApp repository
  kafka-webapp:
    image: ghcr.io/hamza-aziz-ai/kafka-webapp:v0.4.2@sha256:a5864d5444bf784a08d72c2430afe8528b88e2e71c73240ff2c394f27cf14b75
    restart: unless-stopped
    env_file:
      - path: ./master.env
        required: false
    environment:
      # This host has no SSH, Redis or liveness service, so the client waits only for the services that run here
      HOST_CHECK_PORT: 9092
      # One InsightFace-REST container (D-032): nothing listens on 19001, so checking it kept the display waiting (#67)
      PROJECT_SERVICES_PORT: 6385,19000,19530,9092,${DISPLAY_IMAGE_PORT:-20013}
      # Newer Kafka-WebApp images check these instead, so failures of the internal services, which publish no host port,
      # still show on the display; older images ignore it
      PROJECT_SERVICES: 6385,19000,19530,9092,mfr-database-controller:20001,mfr-feedback-controller:20012,display-image-server:20013
      # This client's own portrait server, by service name (Kafka-WebApp reads it from v0.2; older images use IP_ADDRESS:20013)
      IMAGE_SERVER_ADDRESS: http://display-image-server:20013/post_images
      # The client's read-only display login (D-037); empty until the owner's cutover, which Kafka-WebApp reads as no login
      KAFKA_USERNAME: ${KAFKA_DISPLAY_USER:-}
      KAFKA_PASSWORD: ${KAFKA_DISPLAY_PASSWORD:-}
    ports:
      # 9090 is the reporting API on this host
      - "127.0.0.1:${DISPLAY_PORT:-9095}:9090"
    networks:
      - default
      - edge
    depends_on:
      display-image-server:
        condition: service_healthy

  # Live view (D-047): each camera passed through as HLS, reached only through the proxy's /live/ route behind the
  # sign-in, so nothing is published on the host. It pulls a camera over TCP only while someone watches it
  live-video:
    image: bluenviron/mediamtx:1.21.3@sha256:59e43552f3be43695b70c19424dc2a42fcec18075f88d91561a24ac5d70a586c
    restart: unless-stopped
    command: ["/live-video/mediamtx.yml"]
    volumes:
      - live-video-config:/live-video:ro
    networks:
      - default
      - edge
    depends_on:
      mfr-api-service:
        condition: service_healthy

volumes:
  # MediaMTX's configuration, which holds camera passwords: a Docker volume, not a file in the site folder
  live-video-config:

# Shared with the host's HTTPS proxy (D-040); the watcher and the start script create it
networks:
  edge:
    name: cctv-edge
    external: true
