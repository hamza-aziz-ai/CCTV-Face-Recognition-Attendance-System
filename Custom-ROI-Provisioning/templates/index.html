<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ROI Provisioning</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f0f0f0; }
        h1 { background: #00008b; color: #fff; padding: 10px; margin: 0; text-align: center; font-size: 1.4em; }
        main { max-width: 1100px; margin: 0 auto; padding: 16px; background: #fff; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        button { background: #00008b; color: #fff; border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer; }
        button:disabled { background: #999; cursor: default; }
        .stage { position: relative; display: inline-block; max-width: 100%; }
        .stage img { display: block; max-width: 100%; height: auto; }
        .stage canvas { position: absolute; left: 0; top: 0; cursor: crosshair; }
        #status { margin: 8px 0; min-height: 1.2em; }
        #preview { max-width: 100%; margin-top: 12px; border: 1px solid #ccc; }
    </style>
</head>
<body>
<h1>Custom Region of Interest Provisioning</h1>
<main>
    <p>Pick a camera, then click around the area to recognise faces in. Everything outside the shape is ignored.
       Points are saved at the camera's full resolution. Restart producer-consumer after saving.</p>
    <div class="controls">
        <label for="camera">Camera</label>
        <select id="camera"></select>
        <button id="load">Load snapshot</button>
        <button id="undo" disabled>Undo point</button>
        <button id="reset" disabled>Clear shape</button>
        <button id="show-preview" disabled>Preview crop</button>
        <button id="save" disabled>Save region</button>
        <button id="remove" disabled>Remove region</button>
    </div>
    <div id="status" role="status"></div>
    <div class="stage">
        <img id="snapshot" alt="Camera snapshot">
        <canvas id="canvas"></canvas>
    </div>
    <img id="preview" alt="Preview of the cropped region" hidden>
</main>
<script>
    const $ = (id) => document.getElementById(id);
    const img = $("snapshot"), canvas = $("canvas"), ctx = canvas.getContext("2d");
    // shown: the snapshot on screen, its camera and size; loads counts snapshot requests, so a late answer for a camera
    // no longer selected is ignored and its size can never be saved with another camera's region
    let saved = {}, savedSize = {}, points = [], shown = null, loads = 0;

    function status(text, error) { $("status").textContent = text; $("status").style.color = error ? "#b00" : "#060"; }
    function camera() { return $("camera").value; }
    function scale() { return img.naturalWidth / img.clientWidth; }

    function draw() {
        canvas.width = img.clientWidth; canvas.height = img.clientHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (points.length) {
            ctx.strokeStyle = "#ff0"; ctx.fillStyle = "rgba(255,255,0,0.2)"; ctx.lineWidth = 2;
            ctx.beginPath();
            points.forEach(([x, y], i) => { const sx = x / scale(), sy = y / scale(); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
            if (points.length > 2) ctx.closePath();
            ctx.fill(); ctx.stroke();
        }
        const ready = shown !== null && shown.camera === camera();
        $("undo").disabled = $("reset").disabled = !points.length;
        $("show-preview").disabled = $("save").disabled = !(ready && points.length > 2);
        $("remove").disabled = !saved[camera()];
    }

    async function request(url, options) {
        const response = await fetch(url, options);
        if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.error || response.statusText);
        }
        return response;
    }

    async function loadCameras() {
        const list = await (await request("/api/cameras")).json();
        $("camera").innerHTML = "";
        for (const cam of list) {
            saved[cam.id] = cam.points; savedSize[cam.id] = cam.size;
            const label = cam.points ? (cam.size ? " (region set)" : " (region set, size not recorded: save it again)") : "";
            $("camera").add(new Option(cam.id + label, cam.id));
        }
    }

    $("load").onclick = async () => {
        status("Reading a frame from the camera...");
        $("preview").hidden = true;
        const load = ++loads, cam = camera();
        try {
            const blob = await (await request("/snapshot?camera=" + encodeURIComponent(cam))).blob();
            if (load !== loads) return;
            img.onload = () => {
                if (load !== loads) return;
                shown = {camera: cam, size: [img.naturalWidth, img.naturalHeight]};
                points = (saved[cam] || []).map((p) => [...p]); draw();
                const old = savedSize[cam];
                status(saved[cam] && old && (old[0] !== shown.size[0] || old[1] !== shown.size[1])
                    ? `The region was drawn on a ${old[0]}x${old[1]} picture; the camera now sends ${shown.size[0]}x${shown.size[1]}. Draw it again.`
                    : "Click to add points.", Boolean(saved[cam] && old && (old[0] !== shown.size[0] || old[1] !== shown.size[1])));
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) { if (load === loads) status(e.message, true); }
    };

    canvas.onclick = (e) => {
        points.push([Math.round(e.offsetX * scale()), Math.round(e.offsetY * scale())]);
        draw();
    };
    $("undo").onclick = () => { points.pop(); draw(); };
    $("reset").onclick = () => { points = []; draw(); };
    window.onresize = draw;

    $("show-preview").onclick = async () => {
        try {
            const blob = await (await request("/preview", {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({camera: camera(), points}),
            })).blob();
            $("preview").src = URL.createObjectURL(blob); $("preview").hidden = false;
            status("This is what the producer will see.");
        } catch (e) { status(e.message, true); }
    };

    async function store(newPoints, done) {
        try {
            const body = await (await request("/api/roi", {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify(newPoints ? {camera: shown.camera, points: newPoints, size: shown.size} : {camera: camera(), points: null}),
            })).json();
            const selected = camera();
            await loadCameras(); $("camera").value = selected; draw();
            status(done + " " + body.note);
        } catch (e) { status(e.message, true); }
    }
    $("save").onclick = () => store(points, "Region saved.");
    $("remove").onclick = () => { points = []; store(null, "Region removed."); };
    $("camera").onchange = () => { loads++; shown = null; img.removeAttribute("src"); points = []; $("preview").hidden = true; draw(); status(""); };

    loadCameras().then(draw).catch((e) => status(e.message, true));
</script>
</body>
</html>
