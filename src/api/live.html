<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live view · Attendance Display</title>
    <style>
        /* The display's own theme and fonts, as on the sign-in page */
        @font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: swap; src: url("/static/fonts/ibm_plex_sans_regular.ttf"); }
        @font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-display: swap; src: url("/static/fonts/ibm_plex_sans_semibold.ttf"); }

        :root {
            --ink: #14202b;
            --ink-muted: #46535f;
            --ground: #f3f5f7;
            --surface: #ffffff;
            --line: #d5dbe1;
            --accent: #0b5f63;
            --accent-dark: #084649;
            --error: #a32019;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--ground);
            color: var(--ink);
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        }

        /* The site's top bar, the same markup as the camera region page */
        .appbar { display: flex; align-items: center; gap: 20px; height: 56px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
        .product { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; color: var(--ink); text-decoration: none; }
        .product .mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: #fff; }
        .product .mark svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .sitenav { display: flex; align-self: stretch; gap: 4px; }
        .sitenav a { display: flex; align-items: center; padding: 0 12px; border-bottom: 2px solid transparent; color: var(--ink-muted); font-weight: 600; text-decoration: none; }
        .sitenav a:hover { color: var(--ink); }
        .sitenav a[aria-current="page"] { border-bottom-color: var(--accent); color: var(--accent); }
        .spacer { flex: 1; }
        .account { display: flex; align-items: center; gap: 10px; color: var(--ink-muted); white-space: nowrap; }
        .account strong { color: var(--ink); font-weight: 600; }
        .account button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
        .account button:hover { border-color: var(--accent); color: var(--accent); }
        [hidden] { display: none !important; }

        .pagehead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 20px 28px 0; }
        h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
        .note { color: var(--ink-muted); font-size: 0.9rem; }
        @media (max-width: 760px) { .sitenav { display: none; } }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 20px;
            padding: 24px 28px;
        }

        .camera {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        .camera h2 { margin: 0; padding: 12px 16px; font-size: 1rem; font-weight: 600; }

        .video {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #0d151c;
        }

        .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        .video button {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 140px;
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .video button:hover, .video button:focus-visible { background: var(--accent-dark); }

        ol { list-style: none; margin: 0; padding: 8px 16px 14px; min-height: 64px; }

        li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid var(--ground);
            font-size: 0.92rem;
        }

        li:last-child { border-bottom: 0; }

        .when { color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

        .empty, .error { color: var(--ink-muted); padding: 6px 0; }

        .error { color: var(--error); }
    </style>
</head>
<body>
<header class="appbar">
    <a class="product" href="/"><span class="mark"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M16 10.5 21 8v8l-5-2.5"/></svg></span>Attendance Display</a>
    <nav class="sitenav" aria-label="Site">
        <a href="/">Display</a>
        <a href="/api/live" aria-current="page">Live view</a>
        <!-- Shown to client admins only; the region page checks the role itself -->
        <a href="/roi/" id="nav-roi" hidden>Camera regions</a>
    </nav>
    <span class="spacer"></span>
    <div class="account" id="account" hidden><span>Signed in as <strong id="account-name"></strong></span><button type="button" id="sign-out">Sign out</button></div>
</header>
<div class="pagehead">
    <h1>Live view</h1>
    <span class="note">Video starts only when you press Play. Latest recognitions refresh every 5 seconds.</span>
</div>
<main id="cameras" aria-live="polite"></main>
<script>
    const main = document.getElementById("cameras");

    // "22:45:46.123" from the API as "10:45:46 PM": the owner reads times in 12-hour format
    function clock(time) {
        const [h, m, s] = String(time).split(":").map(Number);
        if (Number.isNaN(h) || Number.isNaN(m)) return time;
        const seconds = s === undefined || Number.isNaN(s) ? "" : `:${String(Math.floor(s)).padStart(2, "0")}`;
        return `${h % 12 || 12}:${String(m).padStart(2, "0")}${seconds} ${h < 12 ? "AM" : "PM"}`;
    }

    function text(tag, value, className) {
        const node = document.createElement(tag);
        node.textContent = value;
        if (className) node.className = className;
        return node;
    }

    function card(camera) {
        const section = document.createElement("section");
        section.className = "camera";
        section.append(text("h2", camera.name));

        const video = document.createElement("div");
        video.className = "video";
        const play = text("button", "Play");
        play.type = "button";
        play.setAttribute("aria-label", `Play ${camera.name}`);
        // The camera is pulled only while someone watches, so nothing loads until asked
        play.addEventListener("click", () => {
            const frame = document.createElement("iframe");
            frame.src = `/live/${encodeURIComponent(camera.path)}/`;
            frame.title = `Live video from ${camera.name}`;
            frame.allow = "autoplay; fullscreen";
            video.replaceChildren(frame);
        });
        video.append(play);
        section.append(video);

        const list = document.createElement("ol");
        list.dataset.camera = camera.name;
        list.setAttribute("aria-label", `Latest recognitions at ${camera.name}`);
        list.append(text("li", "No recognitions yet", "empty"));
        section.append(list);
        return section;
    }

    async function refreshEvents() {
        try {
            const response = await fetch("/api/live/events", { credentials: "same-origin" });
            if (response.status === 401) { window.location.href = "/auth/sign-in"; return; }
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const events = await response.json();
            for (const list of main.querySelectorAll("ol")) {
                const rows = events[list.dataset.camera] || [];
                list.replaceChildren(...(rows.length ? rows.map((row) => {
                    const item = document.createElement("li");
                    const score = row.score === null ? "" : ` · ${row.score.toFixed(2)}`;
                    item.append(text("span", row.person_id), text("span", `${row.date} ${clock(row.time)}${score}`, "when"));
                    return item;
                }) : [text("li", "No recognitions yet", "empty")]));
            }
        } catch (error) {
            for (const list of main.querySelectorAll("ol")) list.replaceChildren(text("li", "Could not load recognitions", "error"));
        }
    }

    async function start() {
        const response = await fetch("/api/live/cameras", { credentials: "same-origin" });
        if (response.status === 401) { window.location.href = "/auth/sign-in"; return; }
        if (!response.ok) { main.replaceChildren(text("p", `Live view unavailable (HTTP ${response.status})`, "error")); return; }
        const cameras = await response.json();
        if (!cameras.length) { main.replaceChildren(text("p", "No RTSP cameras are configured.", "empty")); return; }
        main.replaceChildren(...cameras.map(card));
        refreshEvents();
        setInterval(refreshEvents, 5000);
    }

    // The signed-in account in the top bar, and the region page link for client admins
    let csrf = "";
    fetch("/auth/me", { credentials: "same-origin" }).then((r) => r.ok ? r.json() : null).then((me) => {
        if (!me) return;
        csrf = me.csrf_token || "";
        document.getElementById("account-name").textContent = me.name;
        document.getElementById("account").hidden = false;
        document.getElementById("nav-roi").hidden = me.role !== "client_admin";
    }).catch(() => {});
    document.getElementById("sign-out").addEventListener("click", async () => {
        await fetch("/auth/logout", { method: "POST", credentials: "same-origin", headers: { "X-CSRF-Token": csrf } }).catch(() => {});
        window.location.href = "/auth/sign-in";
    });

    start();
</script>
</body>
</html>
