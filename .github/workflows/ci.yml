name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Reused by the release workflow so images are only published from a commit that passed these checks
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Syntax errors and undefined names only; the codebase predates any style config
      - run: pipx run ruff==0.17.3 check --select E9,F63,F7,F82 --target-version py314 --extend-exclude STANDALONE-SERVICES,graphify-out --output-format github .
      # Model manifest must match the code and config it describes; unverified (null) fields only block releases
      - run: python3 -I mlops/check_manifest.py
      # Deployment watcher decisions (deploy, skip, roll back, bundle checks) with Docker and the registry faked; then the laptop-only automerge nudge
      - run: python3 -I deploy/test_watch.py
      - run: python3 -I deploy/nudge_automerge.py demo
      # Enrolment photo checks (D-026)
      - run: python3 -I src/util/enrolment_checks.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action lists a PR's commits through the API; read-only, and comments are off so it never needs write
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Personal-account repo: no GITLEAKS_LICENSE needed
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Unset credentials only produce warnings; this catches YAML and schema errors
      - run: |
          docker compose -f docker-compose-main.yml config --quiet
          docker compose -f docker-compose-main.yml -f docker-compose.dev.yml config --quiet
          DATASET_STORE_USER=ci DATASET_STORE_PASSWORD=ci DATASET_STORE_DIR=/tmp/store docker compose -f STANDALONE-SERVICES/Dataset-Store/docker-compose.yml config --quiet
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci docker compose -f STANDALONE-SERVICES/PostgreSQL/docker-compose.yml config --quiet
      # GitHub and Compose reject duplicate keys, which git merges can add and config --quiet can miss
      - run: python3 -I deploy/yaml_strict.py .github/workflows/*.yml docker-compose*.yml STANDALONE-SERVICES/*/docker-compose*.yml
      # Two clients' stacks on one host: no fixed names, own ports, own site folder, internal services by name (D-036)
      - run: python3 -I deploy/test_layout.py
      # The deployment bundle: only allow-listed files, every image pinned, and its compose file still valid (D-033)
      - run: |
          python3 -I deploy/make_bundle.py demo /tmp/bundle
          docker compose -f /tmp/bundle/docker-compose-main.yml config --quiet
      # The standalone scripts from a bundle with a separate site folder, and from the checkout, with Docker stubbed
      - run: bash deploy/test_standalone_scripts.sh

  # Whether a PR changes anything an image is built from. The image builds used most of the monthly Actions minutes,
  # and docs-only PRs were common. Pushes and release runs always build.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then echo "images=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$changed"
          # Only docs/ and Markdown files: nothing an image is built from
          if grep -qvE '^docs/|\.md$' <<<"$changed"; then echo "images=true"; else echo "images=false"; fi >> "$GITHUB_OUTPUT"

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: producer-consumer
            dockerfile: main.Dockerfile
            files: src/main.py
          - service: database-controller
            dockerfile: database-server.Dockerfile
            files: src/database_server/postgresql_server_controller.py src/database_server/healthcheck_db_controller.sh
          - service: feedback-controller
            dockerfile: feedback-server.Dockerfile
            files: src/feedback_server/feedback_msg_server_controller.py src/feedback_server/healthcheck_feedback_controller.sh
          - service: api
            dockerfile: api.Dockerfile
            files: src/api/app.py src/api/healthcheck_api.sh
          - service: display-image
            dockerfile: display-image.Dockerfile
            files: src/fetch_face_image_server/app.py src/fetch_face_image_server/healthcheck_display_image_server.sh
          - service: dynamic-face-dataset-collector
            dockerfile: dynamic-face-dataset-collector.Dockerfile
            files: src/dynamic_face_data_collector/api.py src/dynamic_face_data_collector/healthcheck.sh
          - service: automatic-milvus-db-update
            dockerfile: automatic-milvus-db-update.Dockerfile
            files: src/automatic-vector-db-updation/milvus_updater.py
          - service: roi
            dockerfile: roi.Dockerfile
            files: Custom-ROI-Provisioning/app.py Custom-ROI-Provisioning/templates/index.html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ci/${{ matrix.service }}:test
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Smoke test: dependencies resolve and import, entrypoint and healthcheck shipped,
      # site config and secrets kept out of the image (they are mounted at runtime)
      - name: Smoke test
        env:
          FILES: ${{ matrix.files }}
        run: |
          docker run --rm --entrypoint sh -e FILES ci/${{ matrix.service }}:test -c '
            set -e
            pip check
            python3 -c "import cv2, numpy"
            for f in $FILES; do test -e "$f"; done
            for f in src/*/healthcheck*.sh; do test ! -e "$f" || test -x "$f"; done
            test ! -e master.env
            test ! -e .env
            test ! -e .git
            test ! -e src/Camera-Configuration
          '
      # The workers inherit live Milvus collections, so they must fork; set_start_method raises if it runs too late
      - name: Start method
        if: matrix.service == 'producer-consumer'
        run: |
          docker run --rm --entrypoint python3 -e PYTHONPATH=src -e CLIENT_ID=owner ci/${{ matrix.service }}:test -c '
          import multiprocessing as mp
          import multiprocessing_shared_buffer
          assert mp.get_start_method() == "fork", mp.get_start_method()
          '
      # The ROI page lists cameras, previews and saves one camera's region, and refuses bad input (D-035)
      - name: ROI page
        if: matrix.service == 'roi'
        run: docker run --rm --entrypoint python3 -e CLIENT_ID=owner ci/${{ matrix.service }}:test Custom-ROI-Provisioning/test_app.py
      # Face vectors saved with the dataset round-trip through Parquet, and versions are numbered right (D-030)
      - name: Face vectors
        if: matrix.service == 'producer-consumer'
        run: docker run --rm --entrypoint python3 -e CLIENT_ID=owner ci/${{ matrix.service }}:test src/util/face_vectors.py demo
      # Each client's databases, topics and Milvus connection are its own; bad client IDs are refused (D-036)
      - name: Client separation
        if: matrix.service == 'producer-consumer'
        run: docker run --rm --entrypoint python3 ci/${{ matrix.service }}:test src/util/client_checks.py
      # Records save once on the table the code creates, against a real PostgreSQL: the duplicate check broke twice with no test
      - name: Recognition records
        if: matrix.service == 'database-controller'
        run: |
          docker network create records
          docker run -d --name records-db --network records -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci postgres:18.6-trixie
          until docker exec records-db pg_isready -h records-db -U ci; do sleep 1; done
          docker run --rm --network records --entrypoint python3 -e CLIENT_ID=owner -e LEGACY_SHARED_SERVICES=1 -e IP_ADDRESS=records-db -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci ci/${{ matrix.service }}:test src/database_server/test_records.py
      # Logins, roles, CSRF, throttling and revocation, through the running API on a real PostgreSQL (D-039)
      - name: Accounts
        if: matrix.service == 'api'
        run: |
          docker network create accounts
          docker run -d --name accounts-db --network accounts -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci postgres:18.6-trixie
          until docker exec accounts-db pg_isready -h accounts-db -U ci; do sleep 1; done
          docker run --rm --network accounts --entrypoint python3 -e CLIENT_ID=owner -e LEGACY_SHARED_SERVICES=1 -e IP_ADDRESS=accounts-db -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci ci/${{ matrix.service }}:test src/api/test_accounts.py
      # A region at the frame's edge crops, and a dark camera alerts at a steady pace
      - name: Camera
        if: matrix.service == 'producer-consumer'
        run: docker run --rm --entrypoint python3 -e CLIENT_ID=owner -e LEGACY_SHARED_SERVICES=1 ci/${{ matrix.service }}:test src/util/test_camera.py
      # A worse crop on a full cluster used to loop forever and block the collector
      - name: Face saver
        if: matrix.service == 'dynamic-face-dataset-collector'
        run: docker run --rm --entrypoint python3 -e CLIENT_ID=owner ci/${{ matrix.service }}:test src/dynamic_face_data_collector/test_face_saver.py

  # Client isolation on throwaway copies of the shared services (D-036). About 5 minutes and 3.5 GB of images, so only
  # pull requests that touch provisioning, the services' settings or the code that logs in to them run it
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ] && git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(deploy/(provision|test_isolation)\.py|STANDALONE-SERVICES/|src/(parameters|milvus_server)\.py|src/util/face_vectors\.py)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: python3 -I deploy/test_isolation.py

  # Single required status check for branch rules; fails if any job failed or was cancelled
  ci:
    if: always()
    needs: [lint, secrets, compose, changes, images, isolation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
