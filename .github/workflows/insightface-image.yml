name: insightface-image

# Builds our patched InsightFace-REST (D-031) and pushes it to ghcr.io, once per source tree: the tag is the upstream
# version plus the git tree of InsightFace-REST/src, so a change to our patches, the Dockerfile or its base image gets a
# new tag. Deployment hosts pull this image and never build it. release.yml calls this before it publishes; a PR that
# changes InsightFace builds it too, so the build and the runner's disk are proven before the merge.
on:
  workflow_call:
    outputs:
      ref:
        description: The image by tag
        value: ${{ jobs.build.outputs.ref }}
      digest:
        description: Its digest
        value: ${{ jobs.build.outputs.digest }}
  pull_request:
    branches: [main]
    paths:
      - STANDALONE-SERVICES/InsightFace-REST/src/**
      - STANDALONE-SERVICES/standalone-services.env
      - .github/workflows/insightface-image.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out the image tag
        id: ref
        run: |
          set -euo pipefail
          eval "$(grep -E '^(IMAGE|TAG)=' STANDALONE-SERVICES/standalone-services.env)"
          echo "ref=$IMAGE:$TAG-$(git rev-parse --short=12 HEAD:STANDALONE-SERVICES/InsightFace-REST/src)" >> "$GITHUB_OUTPUT"
      - name: Build and push, unless this source tree is already published
        id: push
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "$REF is already published"
          else
            # The TensorRT base image filled the runner's disk and crashed the runner itself, losing the log. Free the
            # preinstalled toolchains this job does not use, put Docker's data on the disk with the most room, and stop
            # with a readable error if that is still too small.
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
              /usr/share/swift /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium
            docker system prune -af > /dev/null
            disk=$(df --output=avail,target -B1G / /mnt 2> /dev/null | tail -n +2 | sort -n | tail -n 1 | awk '{print $2}')
            if [ "$disk" != / ]; then
              cfg=$( (sudo cat /etc/docker/daemon.json 2> /dev/null || echo '{}') | jq --arg d "$disk/docker" '. + {"data-root": $d}')
              echo "$cfg" | sudo tee /etc/docker/daemon.json > /dev/null
              sudo systemctl restart docker
              echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            fi
            df -h / /mnt 2> /dev/null || df -h /
            free=$(df --output=avail -B1G "$disk" | tail -n 1 | tr -d ' ')
            if [ "$free" -lt 45 ]; then
              echo "::error::Only ${free} GB free on $disk; the TensorRT build needs about 45 GB"; exit 1
            fi
            docker build -t "$REF" -f STANDALONE-SERVICES/InsightFace-REST/src/Dockerfile_trt STANDALONE-SERVICES/InsightFace-REST/src
            # ghcr.io refused the first push into the new package after every layer was uploaded ("denied"), as it did
            # for the app images; a retry skips the layers already there
            for attempt in 1 2 3; do
              docker push "$REF" && break
              [ "$attempt" -lt 3 ] || exit 1
              echo "Push attempt $attempt refused; retrying"; sleep 20
            done
            df -h "$disk"
          fi
          digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$REF is ${REF%:*}@$digest"
