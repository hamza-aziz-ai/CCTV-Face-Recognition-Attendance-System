name: release

# Tags and publishes a GitHub Release when the commits merged since the last release call for a version bump
# (D-014). Squash merges make each commit subject a PR title, read as a Conventional Commit:
#   type!: or a "BREAKING CHANGE" footer -> major, feat -> minor, fix/perf -> patch, anything else -> no release.
# automerge starts this workflow after it merges (workflow_dispatch is an event GITHUB_TOKEN may start; its
# merges start no push workflows). It can also be run by hand, optionally forcing the bump.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump; auto reads the merged commit titles
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

# A running release is never cancelled; a queued one plans again from the tags as they are by then.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          subjects=$(git log --format=%s "${last:+$last..}HEAD")
          bodies=$(git log --format=%b "${last:+$last..}HEAD")
          if [ "$BUMP" = auto ]; then
            if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -q '^BREAKING CHANGE' <<<"$bodies"; then BUMP="major"
            elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then BUMP="minor"
            elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<<"$subjects"; then BUMP="patch"
            else
              echo "No feat, fix, perf or breaking change since ${last:-the first commit}; nothing to release."
              echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          IFS=. read -r major minor patch <<<"${last:-v0.0.0}"; major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "Releasing $tag ($BUMP) at $GITHUB_SHA; previous: ${last:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Every CI gate again on the exact commit being released (a squash merge is a new commit).
  ci:
    needs: plan
    if: needs.plan.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  # The deployable images, pushed before the tag exists so a release is never published without them (D-017).
  # Names and tags come from docker-compose-main.yml; the dev override only adds the build sections.
  images:
    needs: [plan, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # All 7 images on one runner hit "No space left on device"; these preinstalled toolchains are unused here
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose -f docker-compose-main.yml -f docker-compose.dev.yml build
          # Compose pushes only services with a build section, so postgres is skipped. One at a time: parallel
          # pushes of the shared base layers into new ghcr.io packages were refused ("denied") at random.
          docker compose --parallel 1 -f docker-compose-main.yml -f docker-compose.dev.yml push

  # Our InsightFace-REST image, built only when its source changed (insightface-image.yml)
  insightface:
    needs: plan
    if: needs.plan.outputs.tag != ''
    uses: ./.github/workflows/insightface-image.yml
    permissions:
      contents: read
      packages: write

  # The deployment bundle (deploy/make_bundle.py): compose files, ops scripts and templates, with every image pinned by
  # digest. Hosts get only this and the images, never the repository (D-033). Pushed by its release tag; hosts follow
  # :stable, which publish moves.
  bundle:
    needs: [plan, images, insightface]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      TOKEN: ${{ github.token }}
      INSIGHTFACE_REF: ${{ needs.insightface.outputs.ref }}
      INSIGHTFACE_DIGEST: ${{ needs.insightface.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          {
            for name in $(grep -oE 'ghcr\.io/hamza-aziz-ai/cctv-face-recognition-[a-z-]+:\$\{IMAGE_TAG' docker-compose-main.yml | cut -d: -f1 | sort -u); do
              echo "$name:$TAG $(docker buildx imagetools inspect "$name:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            done
            echo "$INSIGHTFACE_REF $INSIGHTFACE_DIGEST"
          } > digests.txt
          python3 -c 'import json; print(json.dumps(dict(line.split() for line in open("digests.txt"))))' > digests.json
          python3 -I deploy/make_bundle.py bundle "$TAG" "$GITHUB_SHA" digests.json
          cat bundle/release-manifest.json
          image=ghcr.io/hamza-aziz-ai/cctv-face-recognition-deploy:$TAG
          docker build -f deploy/bundle.Dockerfile --label org.opencontainers.image.version="$TAG" -t "$image" bundle
          # ghcr.io refuses the first pushes into a new package at random ("denied"); a retry skips layers already there
          for attempt in 1 2 3; do docker push "$image" && break; [ "$attempt" -lt 3 ] || exit 1; sleep 20; done

  publish:
    needs: [plan, ci, images, insightface, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    permissions:
      contents: write
      # Only to hand a stale run over to a release of main
      actions: write
      # Only to move the deployment bundle's :stable tag
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Drift fails the release; host-only values still null are listed as unverified but do not block (D-014).
      - run: python3 -I mlops/check_manifest.py
      # GitHub refused GITHUB_TOKEN the v2.0.2 tag (HTTP 403) on a commit whose workflow files no longer matched main,
      # after the next merge had changed one mid-run. The newer main holds this commit too, so release main instead.
      - name: Tag
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then exit 1; fi
          echo "::warning::Tagging $GITHUB_SHA failed and main has moved on to $head; starting a release of main instead."
          gh workflow run release.yml --ref main -f bump="${BUMP:-auto}"
      - name: Publish
        if: steps.tag.outputs.tagged == 'true'
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" mlops/model-manifest.json
      # Hosts follow :stable (D-033): it moves only once the release is published, and never back to an older release.
      - name: Promote the deployment bundle to stable
        if: steps.tag.outputs.tagged == 'true'
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bundle=ghcr.io/hamza-aziz-ai/cctv-face-recognition-deploy
          current=$(docker buildx imagetools inspect "$bundle:stable" --format '{{index .Image.Config.Labels "org.opencontainers.image.version"}}' 2> /dev/null || true)
          if [ -n "$current" ] && [ "$(printf '%s\n' "$current" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "stable is already $current, newer than $TAG: not moved"; exit 0
          fi
          docker buildx imagetools create -t "$bundle:stable" "$bundle:$TAG"
          echo "stable: ${current:-none} -> $TAG"
      # The release is already out, so a failure here only leaves the changelog behind. Read from main, not the
      # checkout: a queued release may have added its entry since this commit. docs: commits never start a release.
      - name: Add the release notes to CHANGELOG.md
        if: steps.tag.outputs.tagged == 'true'
        run: |
          set -euo pipefail
          url="repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md"
          gh api "$url?ref=main" --jq .content | base64 -d > current.md
          sha=$(gh api "$url?ref=main" --jq .sha)
          notes=$(gh release view "$TAG" --json body --jq .body)
          { echo "# Changelog"; echo; echo "## $TAG ($(date -u +%F))"; echo; echo "$notes"; tail -n +2 current.md; } > updated.md
          gh api -X PUT "$url" -f branch=main -f sha="$sha" -f message="docs: add $TAG to the changelog" -f content="$(base64 -w0 updated.md)" > /dev/null

  # A published release supersedes earlier failed runs: close their issues, so open issues are only open problems.
  # Only issues this workflow opened (title and author); a stale run that handed over to main published nothing.
  close-failures:
    needs: [plan, publish]
    if: needs.publish.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - run: |
          set -euo pipefail
          gh issue list --state open --author "github-actions[bot]" --limit 100 --json number,title \
            --jq '.[] | select(.title | test("^Release .+ failed$")) | .number' |
          while read -r n; do
            gh issue close "$n" --reason completed --comment "Superseded: $TAG was published since."
          done

  # Releases run unattended, and GitHub only emails whoever started a run, which here is the automerge bot.
  # An issue assigned to the owner reaches them by email and in the app, even with the deployment host off.
  notify-failure:
    needs: [plan, ci, images, insightface, bundle, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          gh issue create --assignee "$GITHUB_REPOSITORY_OWNER" --title "Release ${TAG:-run} failed" --body "The release workflow failed: $RUN_URL"
