# PostgreSQL shared by every client stack on this host; each client keeps its own databases here (D-036).
# It ran inside the main stack before. The named volume is the same one, so moving it out moves no data (D-038).
services:
  postgresql:
    container_name: cctv-postgresql
    image: postgres:18.6-trixie
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18 (D-020). A named volume: on Docker Desktop a bind
      # path like /workspace/... lives in the VM and is gone after a restart (D-038)
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
    name: cctv-postgres-data
