# DVC remote for the face datasets (D-019). Separate from Milvus's MinIO: its own credentials and a data folder
# outside the repo, so resetting Milvus or deleting a checkout never touches the datasets.
services:
  dataset-store:
    container_name: dataset-store
    restart: unless-stopped
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    environment:
      MINIO_ROOT_USER: ${DATASET_STORE_USER:?set DATASET_STORE_USER in .env}
      MINIO_ROOT_PASSWORD: ${DATASET_STORE_PASSWORD:?set DATASET_STORE_PASSWORD in .env}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - ${DATASET_STORE_DIR:?set DATASET_STORE_DIR in .env}:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # One-shot: creates the bucket DVC pushes to; safe to re-run
  dataset-store-bucket:
    container_name: dataset-store-bucket
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      dataset-store:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${DATASET_STORE_USER}
      MINIO_ROOT_PASSWORD: ${DATASET_STORE_PASSWORD}
    entrypoint: ["sh", "-c", "mc alias set store http://dataset-store:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing store/dvc"]
