# Confluent Platform 8.4.0 broker, community edition, started from confluentinc/cp-all-in-one v8.4.0.
# Local changes: the broker advertises ${IP_ADDRESS} (set by set_configuration.sh), every service restarts unless stopped
# (D-018), and clients log in (D-037): SCRAM on 9092, plaintext only on the broker's own loopback (../auth/kafka.env).
# Schema Registry, Connect, ksqlDB, REST Proxy and Flink were removed: nothing here used them, and REST Proxy and
# Connect were open routes around every client's access rules. Their volumes, if any, were left in place.
services:

  broker:
    image: confluentinc/cp-kafka:8.4.0
    hostname: broker
    container_name: broker
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "127.0.0.1:9101:9101"
    env_file:
      - ../auth/kafka.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:29092,CLIENTS://${IP_ADDRESS}:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      # Topic data on a volume: a recreated broker used to lose every topic
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      # Topics are created on purpose, by deploy/provision.py, with one partition per camera (D-037)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Web UI to browse topics and watch messages live; the community edition has no Control Center (D-028).
  # Bound to 127.0.0.1: it has no login of its own, and messages carry people's IDs. It reads every client's topics
  # with its own read-only Kafka login, made by deploy/provision.py --init-kafbat. Off by default; to open it:
  #   docker compose --env-file <deploy folder>/admin.env --profile ui up -d kafka-ui
  kafka-ui:
    profiles: [ui]
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    hostname: kafka-ui
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="kafbat" password="${KAFBAT_PASSWORD:-}";'
      KAFKA_CLUSTERS_0_READONLY: 'true'

volumes:
  kafka-data:
